  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  /* Pensé pour une boîte de widget réglée sur 1920x1080 / Top 0 / Left 0
     (même logique que le compteur de subs). Positionné en dessous du
     badge live pour ne pas se superposer — ajuste "top" si besoin. */
  #wrap {
    position: absolute;
    top: 150px;
    left: 40px;
    display: flex;
    align-items: center;
    height: 100px;
    border-radius: 4px;
    overflow: hidden;
    background: rgba(10,10,13,0.72);
    border: 1px solid rgba(246,245,241,0.14);
  }

  /* La photo occupe le bord gauche de la carte, sans cadre séparé :
     elle touche les bords (haut/bas/gauche) et se fond dans le fond
     sombre via un dégradé de transparence sur sa droite, plutôt
     qu'un rectangle collé avec une bordure nette. */
  #photo-slot {
    position: relative;
    width: 130px;
    height: 100%;
    flex-shrink: 0;
  }

  #photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
    filter: grayscale(0.25) contrast(1.05) brightness(0.9);
    -webkit-mask-image: linear-gradient(to right, #000 45%, transparent 96%);
            mask-image: linear-gradient(to right, #000 45%, transparent 96%);
  }

  /* Léger voile sombre par-dessus la photo pour l'unifier avec le
     fond de la carte (évite l'effet "photo qui flotte"). */
  #photo-slot::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,10,13,0.15), rgba(10,10,13,0.55));
  }

  #meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 14px 22px 14px 0;
    margin-left: -18px;
    position: relative;
    z-index: 1;
  }

  #label {
    font-family: 'Dharma Bold', sans-serif;
    font-style: italic;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.04em;
    color: #f6f5f1;
    line-height: 1;
    text-shadow: 0 0.1em 0.3em rgba(0,0,0,0.6);
  }

  #countdown {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }

  .unit .value {
    font-family: 'Dharma Bold', sans-serif;
    font-style: italic;
    font-weight: 800;
    font-size: 28px;
    line-height: 1;
    color: #f6f5f1;
    text-shadow:
      0 0 0.1em rgba(255,255,255,0.7),
      0 0 0.3em rgba(255,255,255,0.4);
    font-variant-numeric: tabular-nums;
  }

  .unit .caption {
    font-family: 'Dharma Light', sans-serif;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #9c99a6;
  }

  .sep {
    font-family: 'Dharma Bold', sans-serif;
    font-style: italic;
    font-size: 22px;
    color: rgba(246,245,241,0.3);
    align-self: flex-start;
    margin-top: 2px;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="photo-slot">
    <img id="photo" src="https://350youss.github.io/cdmbracket/overlays/images/lorenzi.jpg" alt="Lorenzi">
  </div>
  <div id="meta">
    <div id="label">Lorenzi Time</div>
    <div id="countdown">
      <div class="unit"><span class="value" id="d">00</span><span class="caption">jours</span></div>
      <span class="sep">/</span>
      <div class="unit"><span class="value" id="h">00</span><span class="caption">heures</span></div>
      <span class="sep">/</span>
      <div class="unit"><span class="value" id="m">00</span><span class="caption">min</span></div>
      <span class="sep">/</span>
      <div class="unit"><span class="value" id="s">00</span><span class="caption">sec</span></div>
    </div>
  </div>
</div>

<script>
  // Même échéance que la page kooradex.fr/lorenzi-time :
  // 1er septembre 2026, 20h (heure de Paris = UTC+2 en été).
  const DEADLINE = new Date('2026-09-01T18:00:00Z');

  const elD = document.getElementById('d');
  const elH = document.getElementById('h');
  const elM = document.getElementById('m');
  const elS = document.getElementById('s');

  function pad(n) {
    return String(Math.max(0, n)).padStart(2, '0');
  }

  function tick() {
    const diff = DEADLINE - new Date();
    if (diff <= 0) {
      elD.textContent = elH.textContent = elM.textContent = elS.textContent = '00';
      return;
    }
    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    elD.textContent = pad(days);
    elH.textContent = pad(hours);
    elM.textContent = pad(minutes);
    elS.textContent = pad(seconds);
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
