<style>
:root{
  --bg:#0a0b0d; --panel:#131417; --panel2:#191a1e; --panel3:#1f2025;
  --ink:#f2f2f0; --sub:#98999e; --muted:#5c5d63; --faint:#38393e;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.2);
  --champion:#e2a53f; --champion-dim:rgba(226,165,63,.14);
  --body:'Inter',-apple-system,'Segoe UI',sans-serif;
  --disp:'General Sans',-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.19,1,.22,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:0 32px 110px;}
@media (max-width:640px){.wrap{padding:0 16px 90px;}}

.eyebrow{margin-top:20px;font-family:var(--body);font-weight:600;font-size:11.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--champion);}

.toolbar{margin-top:20px;padding-top:0;}
.tabs{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;}
.tab{font-family:var(--body);font-weight:700;font-size:12.5px;letter-spacing:.01em;color:var(--sub);
  text-decoration:none;padding:9px 18px;border-radius:999px;transition:background .18s var(--ease),color .18s var(--ease);}
.tab.active{background:var(--champion);color:#241605;}
.tab:not(.active):hover{color:#fff;}

.stub{margin-top:60px;padding:60px 24px;text-align:center;border:1px dashed var(--line-strong);border-radius:18px;}
.stub .kicker{font-family:var(--body);font-weight:700;font-size:11px;color:var(--champion);
  text-transform:uppercase;letter-spacing:.08em;}
.stub h1{margin-top:14px;font-family:var(--disp);font-weight:700;font-size:clamp(28px,4.4vw,42px);
  color:#fff;line-height:1.05;}
.stub p{margin-top:14px;font-family:var(--body);font-size:15px;color:var(--sub);max-width:46ch;margin-left:auto;margin-right:auto;line-height:1.55;}
.stub a{display:inline-block;margin-top:24px;font-family:var(--body);font-weight:700;font-size:13px;
  color:#241605;background:var(--champion);border-radius:999px;padding:12px 24px;text-decoration:none;}
.stub a:hover{background:#eeb457;}
</style>
</head>

  border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:9px 10px 9px 22px;
  box-shadow:0 12px 30px -8px rgba(0,0,0,.5);font-family:-apple-system,'Segoe UI',Arial,sans-serif;}

.kdx-brand{font-family:'ToyBox','Tanker',sans-serif;font-size:18px;letter-spacing:.02em;text-transform:uppercase;color:#fff;flex-shrink:0;}
.kdx-links{display:flex;align-items:center;justify-content:center;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;}
.kdx-links::-webkit-scrollbar{display:none;}
.kdx-links a{font-weight:500;font-size:13px;color:#98999e;white-space:nowrap;flex-shrink:0;

.kdx-links a:hover{color:#fff;background:rgba(255,255,255,.06);}
.kdx-links a.active{color:#fff;background:rgba(255,255,255,.1);}
@media(max-width:640px){.kdx-links a{font-size:12px;padding:8px 10px;}}
</style>
