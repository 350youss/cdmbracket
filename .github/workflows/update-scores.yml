name: Update WC 2026 Scores

on:
  schedule:
    # 19h-minuit Paris (17h-22h UTC)
    - cron: '0 17-23 * * *'
    # Minuit-9h Paris (0h-7h UTC)
    - cron: '0 0-7 * * *'
  workflow_dispatch: # Déclenchement manuel possible

jobs:
  update-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update scores
        run: python scripts/update_scores_espn.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "Pas de changement." || (
            git commit -m "🏆 Scores CDM mis à jour — $(date -u '+%d/%m/%Y %H:%M UTC')"
            git push
          )
