name: Update WC 2026 Scores

on:
  schedule:
    # Toutes les 30 min pendant les heures de match, à des minutes DÉCALÉES
    # (17 et 47) car la minute 0 est le pic de charge GitHub → runs souvent
    # retardés/abandonnés. Heures de match CDM : ~16:00 UTC → 07:00 UTC.
    # 16:00-23:47 UTC = 18h00-01h47 Paris
    - cron: '17,47 16-23 * * *'
    # 00:00-07:47 UTC = 02h00-09h47 Paris
    - cron: '17,47 0-7 * * *'
  workflow_dispatch: # Déclenchement manuel possible

jobs:
  update-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch and update scores
        run: python scripts/update_scores_espn.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "Pas de changement." || (
            git commit -m "🏆 Scores CDM mis à jour — $(date -u '+%d/%m/%Y %H:%M UTC')"
            git push
          )
